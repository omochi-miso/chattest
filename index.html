<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- テスト用なので検索エンジンに載せない -->
<meta name="robots" content="noindex, nofollow">
<title>テストページ</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 15vh 1rem 0; color: #333; }
  h1 { font-size: 1.6rem; }
  p { color: #666; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>テスト表示OK</h1>
  <p>表示中のアドレス：<code id="host"></code></p>
  <script>document.getElementById("host").textContent = location.hostname + location.pathname;</script>

  <!-- ▼▼▼ この物件の名前（ページごとにここだけ書き換える） ▼▼▼ -->
  <script>
    window.MIIBO_PROPERTY = "サンメゾン京田辺駅前ユニハイム 1107号室";
  </script>
  <!-- ▲▲▲ ここまで ▲▲▲ -->

  <!-- ▼▼▼ ここからチャット（miiboの埋め込みコード。物件名をチャットに渡すよう一部変更済み） ▼▼▼ -->
  <script>
        // CSSとアイコンのリンクを追加する関数
        function addStylesheet(href) {
            let link = document.createElement('link');
            link.href = href;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
        }

        // トグルボタンを作成し、追加する関数
        function createToggleButton() {
            const toggleBtn = document.createElement('div');
            toggleBtn.id = 'chatbot-toggle_button';
            const anchor = document.createElement('a');
            anchor.id = 'chat-button';
            anchor.href = '#';
            anchor.addEventListener('click', event => {
              event.preventDefault();
              toggleChatbox();
            });
            // 【変更】画像のボタンをやめて、モダンなボタンに差し替え（見た目は下の <style> で調整）
            anchor.className = 'pc-toggle';
            anchor.setAttribute('aria-label', 'この物件についてAIに質問する');
            anchor.innerHTML =
              '<span class="pc-toggle__icon" aria-hidden="true">' +
                '<svg class="pc-ico-chat" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01" stroke-width="2.6"/></svg>' +
                '<svg class="pc-ico-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
              '</span>' +
              '<span class="pc-toggle__text">' +
                '<span class="pc-toggle__sub"><i class="pc-dot"></i>AIがすぐにお答えします</span>' +
                '<span class="pc-toggle__main">この物件について質問する</span>' +
              '</span>';
            toggleBtn.appendChild(anchor);
            document.body.appendChild(toggleBtn);

            // チャットが開いているときはボタンを「×」に切り替える
            const sync = () => {
              const box = document.getElementById('chatbot');
              anchor.classList.toggle('is-open', !!box && box.style.display === 'block');
            };
            setTimeout(() => {
              const box = document.getElementById('chatbot');
              if (box) new MutationObserver(sync).observe(box, { attributes: true, attributeFilter: ['style'] });
            }, 0);
        }

        // チャットボックスのヘッダーを作成する関数
        function createChatboxHeader() {
            const header = document.createElement('div');
            header.id = 'chatbot-header';
            header.style.background = '#1f2a44'; // ← ヘッダーの色（ボタンの --pc-main とそろえる）
            const logo = document.createElement('div');
            logo.id = 'chatbot-logo';
            logo.innerText = '物件案内AI';
            const closeIcon = document.createElement('i');
            closeIcon.id = 'chatbot-close-icon';
            closeIcon.className = 'material-icons material-symbols-outlined waves-light';
            closeIcon.innerText = 'close';
            closeIcon.addEventListener('click', event => {
              event.preventDefault();
              toggleChatbox();
            });
            header.appendChild(logo);
            header.appendChild(closeIcon);
            return header;
        }

        // チャットボックスを作成し、追加する関数
        function createChatbox() {
            const chatbox = document.createElement('div');
            chatbox.id = 'chatbot';
            chatbox.style.display = 'none';

            const header = createChatboxHeader();
            const body = document.createElement('div');
            body.id = 'chatbot-body';
            const iframe = document.createElement('iframe');
            iframe.id = 'inline-frame';
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.dataSrc = 'https://miibo.jp/chat/12ad18e1-4fc4-4f12-b288-b1aa960eb5631792978374008180445?name=%E7%89%A9%E4%BB%B6%E6%A1%88%E5%86%85AI';
            iframe.scrolling = 'no';
            iframe.frameBorder = 'no';
            body.appendChild(iframe);
            chatbox.appendChild(header);
            chatbox.appendChild(body);
            document.body.appendChild(chatbox);
        }

        // チャットボックスの表示/非表示を切り替える関数
        function toggleChatbox(utterance, ...states) {
            var chatbox = document.getElementById('chatbot');
            var iframe = document.getElementById('inline-frame');

            // ここでイベントオブジェクトではなく、文字列または未定義の値が渡されることを確認します。
            if (typeof utterance !== 'string') {
                utterance = null;
            }

            if (chatbox.style.display === 'none' || utterance) {
                chatbox.style.display = 'block';
                var src = 'https://miibo.jp/chat/12ad18e1-4fc4-4f12-b288-b1aa960eb5631792978374008180445?name=%E7%89%A9%E4%BB%B6%E6%A1%88%E5%86%85AI';
                // 【追加】ページに書いた物件名を「property」というステートとしてチャットに渡す
                if (window.MIIBO_PROPERTY) {
                    src += '&property=' + encodeURIComponent(window.MIIBO_PROPERTY);
                }
                // 可変引数からクエリパラメータを生成
                states.forEach(state => {
                    if (state.key && state.value) {
                        src += src.includes('?') ? '&' : '?';
                        src += `${encodeURIComponent(state.key)}=${encodeURIComponent(state.value)}`;
                    }
                });

                // 以下の条件を追加して、再読み込みの必要性をチェック
                if (!iframeLoaded || (utterance && lastUtterance !== utterance)) {
                    if (utterance) {
                        src += src.includes('?') ? '&' : '?';
                        src += "utterance=" + encodeURIComponent(utterance);
                    }
                    iframe.src = src;
                    iframeLoaded = true;
                    lastUtterance = utterance;
                }
            } else {
                chatbox.style.display = 'none';
            }
        }
        // イベントリスナーを設定する関数
        function setupEventListeners() {
            document.querySelectorAll('.chatButton').forEach(button => {
                button.addEventListener('click', event => {
                    event.preventDefault();
                    const utterance = button.getAttribute('data-utterance');
                    const statesData = button.getAttribute('data-states');
                    let states = [];
                    if (statesData) {
                        try {
                            // JSON 形式の文字列をオブジェクトに変換
                            const statesObj = JSON.parse(statesData);
                            // オブジェクトから key-value ペアの配列を生成
                            states = Object.keys(statesObj).map(key => ({ key, value: statesObj[key] }));
                        } catch (e) {
                            console.error("Error parsing states data", e);
                        }
                    }

                    toggleChatbox(utterance, ...states);
                });
            });
        }

        // メイン実行部
        addStylesheet('https://fonts.googleapis.com/icon?family=Material+Icons');
        addStylesheet('https://miibo.jp/css/chatbot.css');
        createToggleButton();
        createChatbox();
        setupEventListeners();

        var iframeLoaded = false; // iframeがロードされたかどうかを追跡するフラグ
        var lastUtterance = ""; // 最後に発話した内容を追跡するフラグ
    </script>

  <!-- ▼ チャットボタンのデザイン（色は --pc-main と --pc-accent を変えるだけ） ▼ -->
  <style>
    :root {
      --pc-main: #1f2a44;    /* ボタンの色（ヘッダーの色とそろえる） */
      --pc-accent: #c8a46a;  /* アイコンの丸の色 */
      --pc-text: #ffffff;    /* 文字の色 */
    }
    #chatbot-toggle_button {
      position: fixed !important;
      right: 20px !important;
      bottom: 20px !important;
      z-index: 2147483000 !important;
      width: auto !important;
      height: auto !important;
    }
    #chatbot { z-index: 2147482999 !important; border-radius: 16px; overflow: hidden; }
    #chatbot-header #chatbot-logo { font-weight: 600; letter-spacing: .02em; }

    .pc-toggle {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 22px 10px 10px;
      background: var(--pc-main); color: var(--pc-text);
      border-radius: 999px;
      text-decoration: none; text-align: left;
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .28), 0 2px 6px rgba(15, 23, 42, .18);
      transition: transform .2s ease, box-shadow .2s ease, padding .2s ease;
    }
    .pc-toggle:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(15, 23, 42, .32), 0 3px 8px rgba(15, 23, 42, .2); }
    .pc-toggle:focus-visible { outline: 3px solid var(--pc-accent); outline-offset: 3px; }

    .pc-toggle__icon {
      position: relative; flex: none;
      width: 44px; height: 44px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--pc-accent); color: var(--pc-main);
    }
    .pc-toggle__icon svg { position: absolute; transition: opacity .2s ease, transform .2s ease; }
    .pc-ico-close { opacity: 0; transform: rotate(-90deg); }

    .pc-toggle__text { display: flex; flex-direction: column; line-height: 1.35; }
    .pc-toggle__sub { font-size: 11px; opacity: .78; display: flex; align-items: center; gap: 6px; }
    .pc-toggle__main { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
    .pc-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); animation: pc-pulse 2s infinite; }
    @keyframes pc-pulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }

    /* チャットを開いているときはボタンを隠す（チャット右上の×で閉じる。送信ボタンに重ならないように） */
    .pc-toggle.is-open { display: none; }

    /* スマホでは小さめに */
    @media (max-width: 480px) {
      #chatbot-toggle_button { right: 16px !important; bottom: 16px !important; }
      .pc-toggle { padding: 8px 16px 8px 8px; gap: 10px; }
      .pc-toggle__icon { width: 40px; height: 40px; }
      .pc-toggle__main { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pc-toggle, .pc-toggle__icon svg { transition: none; }
      .pc-dot { animation: none; }
    }
  </style>

  <!-- ▲▲▲ ここまでチャット ▲▲▲ -->
</body>
</html>
