<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- テスト用なので検索エンジンに載せない -->
<meta name="robots" content="noindex, nofollow">
<title>テストページ</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 15vh 1rem 0; color: #333; }
  h1 { font-size: 1.6rem; }
  p { color: #666; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>テスト表示OK</h1>
  <p>表示中のアドレス：<code id="host"></code></p>
  <script>document.getElementById("host").textContent = location.hostname + location.pathname;</script>

  <!-- ▼▼▼ ここからチャット ▼▼▼
       miibo：公開設定画面でコピーした埋め込みタグ
       Chatbase：Channels → Chat bubble → Deploy でコピーしたスクリプト
       どちらかを、このコメントのすぐ下にそのまま貼り付けてください。 -->
  <script>
        // CSSとアイコンのリンクを追加する関数
        function addStylesheet(href) {
            let link = document.createElement('link');
            link.href = href;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
        }

        // トグルボタンを作成し、追加する関数
        function createToggleButton() {
            const toggleBtn = document.createElement('div');
            toggleBtn.id = 'chatbot-toggle_button';
            const anchor = document.createElement('a');
            anchor.id = 'chat-button';
            anchor.href = '#';
            anchor.addEventListener('click', event => {
              event.preventDefault();
              toggleChatbox();
            });
            const img = document.createElement('img');
            img.src = 'https://firebasestorage.googleapis.com/v0/b/mabo-f1cc7.appspot.com/o/chaticon.png?alt=media&token=1777070f-a83c-403d-8c83-f387f68ecd52';
            img.width = '100';
            img.height = '100';
            anchor.appendChild(img);
            toggleBtn.appendChild(anchor);
            document.body.appendChild(toggleBtn);
        }

        // チャットボックスのヘッダーを作成する関数
        function createChatboxHeader() {
            const header = document.createElement('div');
            header.id = 'chatbot-header';
            header.style.background = '#4169e1';
            const logo = document.createElement('div');
            logo.id = 'chatbot-logo';
            logo.innerText = '物件案内AI（テスト）';
            const closeIcon = document.createElement('i');
            closeIcon.id = 'chatbot-close-icon';
            closeIcon.className = 'material-icons material-symbols-outlined waves-light';
            closeIcon.innerText = 'close';
            closeIcon.addEventListener('click', event => {
              event.preventDefault();
              toggleChatbox();
            });
            header.appendChild(logo);
            header.appendChild(closeIcon);
            return header;
        }

        // チャットボックスを作成し、追加する関数
        function createChatbox() {
            const chatbox = document.createElement('div');
            chatbox.id = 'chatbot';
            chatbox.style.display = 'none';

            const header = createChatboxHeader();
            const body = document.createElement('div');
            body.id = 'chatbot-body';
            const iframe = document.createElement('iframe');
            iframe.id = 'inline-frame';
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.dataSrc = 'https://miibo.jp/chat/12ad18e1-4fc4-4f12-b288-b1aa960eb5631792978374008180445?name=%E7%89%A9%E4%BB%B6%E6%A1%88%E5%86%85AI%EF%BC%88%E3%83%86%E3%82%B9%E3%83%88%EF%BC%89';
            iframe.scrolling = 'no';
            iframe.frameBorder = 'no';
            body.appendChild(iframe);
            chatbox.appendChild(header);
            chatbox.appendChild(body);
            document.body.appendChild(chatbox);
        }

        // チャットボックスの表示/非表示を切り替える関数
        function toggleChatbox(utterance, ...states) {
            var chatbox = document.getElementById('chatbot');
            var iframe = document.getElementById('inline-frame');

            // ここでイベントオブジェクトではなく、文字列または未定義の値が渡されることを確認します。
            if (typeof utterance !== 'string') {
                utterance = null;
            }

            if (chatbox.style.display === 'none' || utterance) {
                chatbox.style.display = 'block';
                var src = 'https://miibo.jp/chat/12ad18e1-4fc4-4f12-b288-b1aa960eb5631792978374008180445?name=%E7%89%A9%E4%BB%B6%E6%A1%88%E5%86%85AI%EF%BC%88%E3%83%86%E3%82%B9%E3%83%88%EF%BC%89';
                // 可変引数からクエリパラメータを生成
                states.forEach(state => {
                    if (state.key && state.value) {
                        src += src.includes('?') ? '&' : '?';
                        src += `${encodeURIComponent(state.key)}=${encodeURIComponent(state.value)}`;
                    }
                });

                // 以下の条件を追加して、再読み込みの必要性をチェック
                if (!iframeLoaded || (utterance && lastUtterance !== utterance)) {
                    if (utterance) {
                        src += src.includes('?') ? '&' : '?';
                        src += "utterance=" + encodeURIComponent(utterance);
                    }
                    iframe.src = src;
                    iframeLoaded = true;
                    lastUtterance = utterance;
                }
            } else {
                chatbox.style.display = 'none';
            }
        }
        // イベントリスナーを設定する関数
        function setupEventListeners() {
            document.querySelectorAll('.chatButton').forEach(button => {
                button.addEventListener('click', event => {
                    event.preventDefault();
                    const utterance = button.getAttribute('data-utterance');
                    const statesData = button.getAttribute('data-states');
                    let states = [];
                    if (statesData) {
                        try {
                            // JSON 形式の文字列をオブジェクトに変換
                            const statesObj = JSON.parse(statesData);
                            // オブジェクトから key-value ペアの配列を生成
                            states = Object.keys(statesObj).map(key => ({ key, value: statesObj[key] }));
                        } catch (e) {
                            console.error("Error parsing states data", e);
                        }
                    }

                    toggleChatbox(utterance, ...states);
                });
            });
        }

        // メイン実行部
        addStylesheet('https://fonts.googleapis.com/icon?family=Material+Icons');
        addStylesheet('https://miibo.jp/css/chatbot.css');
        createToggleButton();
        createChatbox();
        setupEventListeners();

        var iframeLoaded = false; // iframeがロードされたかどうかを追跡するフラグ
        var lastUtterance = ""; // 最後に発話した内容を追跡するフラグ
    </script>

  <!-- ▲▲▲ ここまでチャット ▲▲▲ -->
</body>
</html>
